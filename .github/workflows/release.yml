name: Build & release Firefox extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Lint manifest & sources
        run: npm run lint

      - name: Verify tag matches manifest version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match manifest version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Build extension
        run: npm run build

      - name: Sign extension (optional)
        if: github.event_name == 'push' && secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != ''
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pegass-extractor-extension
          path: web-ext-artifacts/*.{zip,xpi}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: web-ext-artifacts/*.{zip,xpi}
          generate_release_notes: true


