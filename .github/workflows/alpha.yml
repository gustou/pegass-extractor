name: Alpha Build (Auto-signed)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'exemple_extraction.json'
  workflow_dispatch:

jobs:
  build-alpha:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dynamic versioning
        id: versioning
        run: |
          BASE_VERSION=$(node -p "require('./manifest.json').version")
          # AMO : 1–4 segments numériques uniquement. Éviter « version déjà existante » :
          # - ne pas réutiliser BASE.RUN_NUMBER (re-run CI = même numéro).
          # - 3e segment = RUN_NUMBER*10 + RUN_ATTEMPT (re-run incrémente RUN_ATTEMPT).
          IFS='.' read -r MAJ MIN _ <<< "${BASE_VERSION}"
          PATCH_ID=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          ALPHA_VERSION="${MAJ}.${MIN}.${PATCH_ID}"
          echo "version=$ALPHA_VERSION" >> $GITHUB_OUTPUT
          
          # Mise à jour des fichiers manifest et package
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('./manifest.json')); m.version='$ALPHA_VERSION'; fs.writeFileSync('./manifest.json', JSON.stringify(m, null, 2));"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('./package.json')); p.version='$ALPHA_VERSION'; fs.writeFileSync('./package.json', JSON.stringify(p, null, 2));"

      - name: Build extension
        run: npm run build

      - name: Sign extension (Unlisted)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: npm run sign

      - name: Upload Alpha Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pegass-extractor-alpha-${{ steps.versioning.outputs.version }}
          # Pas de *.{zip,xpi} : @actions/glob ne fait pas l’expansion type shell.
          path: web-ext-artifacts
          if-no-files-found: error
